# Monolithic quality gate for branch protection and CI handoff.
name: Org Quality (Python)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    uses: antiphoria/.github/.github/workflows/quality-gate.yml@main
    with:
      policy-ref: main
      python-version: "3.12"
      run-trivy: true
      run-python-ruff: true
      run-python-test: true
      run-node-quality: false
      run-ci-handoff: true
