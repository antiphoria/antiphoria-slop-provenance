[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antiphoria-slop-provenance"
version = "0.3.0"
description = "Antiphoria slop provenance: event-driven story generation, signing, and ledger-backed auditability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46.0.7",
    "rfc8785>=0.1.4",
    "filelock>=3.20.3",
    "pydantic>=2.5.0,<3.0.0",
    "liboqs-python>=0.14.0",
    "c2pa-python>=0.30.0",
    "pygit2>=1.14.0,<2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-httpserver>=1.0.0",
    "hypothesis>=6.0.0",
    "mutmut>=2.0.0",
    # Pinned to match antiphoria/.github Org Quality gate (ci/requirements-ruff.txt).
    "ruff==0.15.8",
]
webauthn = ["fido2>=1.1.0"]

[project.scripts]
slop-cli = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",
    "W503",
]
select = [
    "E",
    "F",
    "W",
]

# Ruff config: see `ruff.toml` (mirrors antiphoria/.github; single source of truth at repo root).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/"
runner = "pytest tests/ -x -q"

[tool.uv]
constraint-dependencies = [
    # Transitive pins (security / Trivy)
    "idna>=3.15",
    "pyasn1>=0.6.3",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]
