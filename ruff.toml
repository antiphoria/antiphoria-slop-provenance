# Base: mirrors antiphoria/.github `ruff.toml` — refresh when org policy changes.
# Repo-only entry below: org CI does not include it; `# ruff: noqa: E402` in that file keeps QG green.
line-length = 100
indent-width = 4
target-version = "py311"

extend-exclude = [
  ".venv",
  "venv",
  "build",
  "dist",
  "node_modules",
]

[lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "UP",
  "I",
  "SIM",
  "A",
  "S",
]
ignore = [
  "E203"
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S107", "S310", "SIM117"]
"**/tests/**/*.py" = ["S101", "S107", "S310", "SIM117"]
"src/adapters/crypto_notary.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
